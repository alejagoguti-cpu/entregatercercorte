<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kennedy 360</title>
<meta name="description" content="Giro fotorrealista de toda la localidad de Kennedy (Bogotá)">
<link rel="icon" href="data:,">
<style>
  :root{--fondo:#060b12;--panel:rgba(8,16,26,.72);--borde:rgba(125,211,252,.22);--texto:#e2f3ff;--suave:#94a3b8;--acento:#7dd3fc;--verde:#34d399}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--fondo);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
  #vista{position:fixed;inset:0;cursor:grab;touch-action:none}
  #vista.arrastrando{cursor:grabbing}
  #vista canvas{width:100%;height:100%;display:block}
  .ic{width:18px;height:18px;flex:none}
  /* portada */
  #carga{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--fondo);transition:opacity .8s,visibility .8s}
  #carga.fuera{opacity:0;visibility:hidden}
  #carga .bg{position:absolute;inset:-10%;background:radial-gradient(55% 45% at 72% 28%,rgba(56,189,248,.2),transparent 70%),radial-gradient(45% 40% at 18% 78%,rgba(52,211,153,.15),transparent 70%);animation:deriva 16s ease-in-out infinite alternate}
  #carga .tarjeta{position:relative;width:min(420px,calc(100vw - 32px));padding:26px 24px 22px;border-radius:18px;background:rgba(10,18,30,.66);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--borde);box-shadow:0 30px 80px rgba(0,0,0,.55);animation:entra .8s cubic-bezier(.2,.7,.2,1) both}
  .marca{display:flex;align-items:center;gap:10px;color:var(--acento);font-size:11px;font-weight:700;letter-spacing:.32em;text-transform:uppercase}
  .marca .ic{width:22px;height:22px}
  #carga h1{margin:14px 0 4px;font-size:32px;line-height:1.05;font-weight:800;color:#f1f7fd}
  #carga h1 span{background:linear-gradient(100deg,#7dd3fc,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
  #carga p{color:var(--suave);font-size:13px;margin-bottom:18px}
  .barra{height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
  .barra i{display:block;height:100%;width:4%;background:linear-gradient(90deg,#38bdf8,#34d399);transition:width .3s}
  #cargaTxt{margin-top:10px;font-size:12px;color:var(--acento)}
  @keyframes deriva{to{transform:translate3d(-3%,2%,0) scale(1.06)}}
  @keyframes entra{from{opacity:0;transform:translateY(14px)}}
  /* interfaz */
  .chip{position:fixed;z-index:10;display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:12px;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--borde)}
  #titulo{top:14px;left:14px}
  #titulo b{font-size:13px;letter-spacing:.04em}
  #titulo small{display:block;font-size:11px;color:var(--suave);margin-top:2px}
  #barraInf{position:fixed;z-index:10;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;align-items:center}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border:none;border-radius:12px;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--texto);font:600 12px/1 inherit;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 0 0 1px var(--borde);transition:background .15s,transform .15s}
  .btn:hover{background:rgba(14,40,64,.88)}
  .btn.redondo{width:46px;padding:0}
  .btn.on{color:#04121c;background:linear-gradient(100deg,#bae6fd,#7dd3fc);box-shadow:none}
  .btn.principal{color:#04121c;background:linear-gradient(100deg,#7dd3fc,#34d399);box-shadow:none;text-decoration:none;white-space:nowrap}
  #grados{position:fixed;z-index:10;right:14px;top:14px;font:600 12px/1 ui-monospace,monospace;color:var(--acento);padding:10px 12px}
  #ayuda{position:fixed;z-index:10;left:50%;bottom:84px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--panel);font-size:12px;color:#cfe7f7;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}
  #ayuda.on{opacity:1}
  #atrib{position:fixed;z-index:9;left:10px;bottom:6px;font-size:10px;color:#e8eef7;opacity:.85;text-shadow:0 1px 2px #000;max-width:60vw}
  /* marcadores */
  #marcas{position:fixed;inset:0;z-index:8;pointer-events:none}
  .pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;transition:opacity .2s}
  .pin .et{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:10px;background:rgba(8,16,26,.8);border:1px solid var(--borde);font-size:12px;font-weight:600;white-space:nowrap;pointer-events:auto;cursor:pointer}
  .pin .et i{width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 4px rgba(52,211,153,.2)}
  .pin .palo{width:1px;height:26px;background:linear-gradient(var(--acento),transparent)}
  .pin.oculto{opacity:0}
  #ficha{position:fixed;z-index:12;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(360px,calc(100vw - 32px));padding:18px;border-radius:16px;background:rgba(10,18,30,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--borde);opacity:0;pointer-events:none;transition:.25s}
  #ficha.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  #ficha h2{font-size:18px;margin-bottom:6px}
  #ficha p{font-size:13px;color:var(--suave);line-height:1.5}
  #ficha .cerrar{position:absolute;right:10px;top:10px;width:30px;height:30px}
  @media(max-width:700px){#titulo small{display:none}.btn{height:42px;padding:0 12px;font-size:11px;letter-spacing:.08em}.btn.redondo{width:42px}#ayuda{bottom:76px;font-size:11px}#grados{display:none}.btn .txt{display:none}.btn.principal .txt{display:inline}#atrib{bottom:auto;top:70px;left:16px;max-width:80vw}}
</style>
</head>
<body>
<div id="vista"><canvas id="lienzo"></canvas></div>
<div id="marcas"></div>

<div id="carga">
  <div class="bg"></div>
  <div class="tarjeta">
    <div class="marca"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5"/><path d="M12 12v10"/></svg><span>REN3D</span></div>
    <h1>Kennedy <span>360</span></h1>
    <p>Vista fotorrealista de toda la localidad · Bogotá</p>
    <div class="barra"><i id="cargaBarra"></i></div>
    <div id="cargaTxt">Cargando vistas…</div>
  </div>
</div>

<div class="chip" id="titulo"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--acento)"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5"/><path d="M12 12v10"/></svg><div><b>Kennedy 360</b><small>Localidad completa · Bogotá</small></div></div>
<div class="chip" id="grados">0°</div>

<div id="barraInf">
  <button class="btn redondo" id="bIzq" aria-label="Girar a la izquierda"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
  <button class="btn" id="bAuto" aria-label="Giro automático"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span class="txt">Girar</span></button>
  <button class="btn redondo" id="bDer" aria-label="Girar a la derecha"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  <button class="btn on" id="bLimite" aria-label="Límite de la localidad"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"><path d="M4 7 9 4l7 2 4 5-3 8-8 1-5-6z"/></svg><span class="txt">Límite</span></button>
  <a class="btn principal" id="bMaqueta" href="./index.html?modo=kennedy"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5"/><path d="M12 12v10"/></svg><span class="txt">Maqueta 3D</span></a>
</div>
<div id="ayuda"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.4l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/></svg><span>Arrastra para girar alrededor de Kennedy</span></div>
<div id="ficha"><button class="btn redondo cerrar" id="fCerrar" aria-label="Cerrar">✕</button><h2 id="fTit"></h2><p id="fTxt"></p></div>
<div id="atrib">Imágenes 3D: Google · Render: Unreal Engine + Cesium</div>

<script>
(function () {
  'use strict';
  // ---- datos del giro (deben coincidir con Scripts/giro_kennedy.py del proyecto Kennedy360) ----
  // dron en órbita alrededor del centro de la localidad (CX, CY; m, X este, Y sur desde El Burro); mira a un punto corrido CORRE m hacia él
  const G = { N: 72, CX: -250, CY: 1225, RADIO: 7000, ALTO: 3500, CORRE: 1500, OBJ_Z: 0, DP: 2.2, FOCAL: 24, SENSOR_W: 36, ASPECTO: 16 / 9, LAT: 4.640683, LON: -74.149778 };
  // cámara del ángulo i: posición, adelante, derecha y arriba (unitarios)
  function camara(i) {
    const a = 2 * Math.PI * i / G.N, s = Math.sin(a), c = Math.cos(a);
    const cx = G.CX + s * G.RADIO, cy = G.CY - c * G.RADIO, cz = G.ALTO;
    // dirección al objetivo + DP (calibración medida sobre el render: el límite OSM calza con el río Bogotá con +2,2°)
    let fx = G.CX + s * G.CORRE - cx, fy = G.CY - c * G.CORRE - cy; const hz = Math.hypot(fx, fy), pt = Math.atan2(G.OBJ_Z - cz, hz) + G.DP * Math.PI / 180;
    fx = fx / hz * Math.cos(pt); fy = fy / hz * Math.cos(pt); const fz = Math.sin(pt);
    let rx = -fy, ry = fx; const rl = Math.hypot(rx, ry); rx /= rl; ry /= rl;
    let ux = -fz * fx, uy = -fz * fy, uz = 1 - fz * fz; const ul = Math.hypot(ux, uy, uz); ux /= ul; uy /= ul; uz /= ul;
    const th = (G.SENSOR_W / 2) / G.FOCAL;
    return { cx, cy, cz, fx, fy, fz, rx, ry, ux, uy, uz, th, tv: th / G.ASPECTO };
  }
  // punto (X este, Y sur, Z arriba; m) -> fracción del cuadro [u, v, profundidad]
  function aCuadro(k, X, Y, Z) {
    const dx = X - k.cx, dy = Y - k.cy, dz = Z - k.cz, z = dx * k.fx + dy * k.fy + dz * k.fz;
    if (z < 5) return null;
    return [0.5 + (dx * k.rx + dy * k.ry) / z / (2 * k.th), 0.5 - (dx * k.ux + dy * k.uy + dz * k.uz) / z / (2 * k.tv), z];
  }
  const MXg = 111320 * Math.cos(4.63 * Math.PI / 180), MYg = 110540;
  // puntos del territorio (lat, lng reales; alto de la etiqueta en m)
  const PUNTOS = [ // OpenStreetMap (data3d/kennedy.json)
    { n: 'Humedal El Burro', lat: 4.641417, lng: -74.149576, z: 10, d: 'Humedal urbano de Kennedy: refugio de aves (tinguas, garzas, patos) y pieza clave de la estructura ecológica del suroccidente de Bogotá.' },
    { n: 'Humedal La Vaca', lat: 4.628701, lng: -74.161978, z: 10, d: 'Humedal junto a Corabastos, en recuperación por la comunidad.' },
    { n: 'Humedal de Techo', lat: 4.645179, lng: -74.141652, z: 10, d: 'Humedal pequeño rodeado de barrios.' },
    { n: 'Corabastos', lat: 4.63089, lng: -74.159504, z: 15, d: 'Central mayorista de alimentos de Bogotá: el nodo que concentra el abastecimiento.' },
    { n: 'Portal Américas', lat: 4.629423, lng: -74.17245, z: 15, d: 'Portal de TransMilenio en el occidente de Kennedy.' },
    { n: 'Parque Timiza', lat: 4.610461, lng: -74.156535, z: 10, d: 'Parque metropolitano con lago.' },
    { n: 'Plaza de las Américas', lat: 4.619142, lng: -74.135191, z: 25, d: 'Centro comercial y nodo urbano sobre la Avenida Américas.' },
    { n: 'Biblioteca El Tintal', lat: 4.643896, lng: -74.153767, z: 15, d: 'Biblioteca pública en una antigua planta de basuras.' },
    { n: 'Parque Cayetano Cañizares', lat: 4.624735, lng: -74.161866, z: 10, d: 'Parque zonal de Kennedy.' },
    { n: 'Kennedy Central', lat: 4.623167, lng: -74.154738, z: 10, d: 'Barrio fundacional de la localidad (1961).' },
    { n: 'Banderas', lat: 4.631319, lng: -74.153232, z: 15, d: 'Glorieta y estación de Banderas, sobre la Avenida Américas.' }
  ];  const $ = id => document.getElementById(id);
  const cv = $('lienzo'), ctx = cv.getContext('2d');
  const chicas = new Array(G.N), grandes = new Array(G.N);
  let actual = 0, pos = 0, vel = 0, auto = false, arrastre = null, ultimoX = 0, ultimoT = 0, dirty = true;
  const nombre = (pref, i) => 'giro/' + pref + '_' + String(i).padStart(3, '0') + '.webp';
  const cargar = (url) => new Promise(r => { const im = new Image(); im.decoding = 'async'; im.onload = () => r(im); im.onerror = () => r(null); im.src = url; });

  // ---- carga: primero todas las vistas livianas (para girar ya), luego la de alta del ángulo actual ----
  async function iniciar() {
    let hechas = 0;
    const orden = []; for (let d = 0; d < G.N; d++) orden.push(d % 2 ? G.N - Math.ceil(d / 2) : d / 2); // alrededor del ángulo inicial
    const PRIMERAS = 13; // el ángulo inicial y 6 a cada lado: con eso se abre; el resto sigue bajando mientras miras
    let abierta = false;
    const abrir = () => {
      if (abierta) return; abierta = true;
      $('carga').classList.add('fuera');
      setTimeout(() => $('ayuda').classList.add('on'), 700); setTimeout(() => $('ayuda').classList.remove('on'), 6500);
      pedirGrande(0);
    };
    const una = async (i) => {
      chicas[i] = await cargar(nombre('s', i)); hechas++; dirty = true;
      $('cargaBarra').style.width = Math.max(4, Math.min(1, hechas / PRIMERAS) * 100) + '%';
      $('cargaTxt').textContent = 'Cargando vistas · ' + Math.min(hechas, PRIMERAS) + ' de ' + PRIMERAS;
      if (hechas >= PRIMERAS) abrir();
    };
    await Promise.all(orden.slice(0, PRIMERAS).map(una));
    abrir();
    for (let k = PRIMERAS; k < orden.length; k += 6) await Promise.all(orden.slice(k, k + 6).map(una));
  }
  // si el ángulo pedido aún no bajó, se muestra el más cercano que ya esté
  function cercana(i) {
    for (let d = 0; d < G.N; d++) { const a = chicas[(i + d) % G.N] || chicas[(i - d + G.N) % G.N]; if (a) return a; }
    return null;
  }
  let pedidaGrande = -1;
  function pedirGrande(i) {
    if (grandes[i] || pedidaGrande === i) return; pedidaGrande = i;
    cargar(nombre('f', i)).then(im => { grandes[i] = im; if (actual === i) dirty = true; });
  }

  // ---- dibujo: imagen ajustada a la pantalla ("cover") ----
  let encuadre = { s: 1, ox: 0, oy: 0, w: 1, h: 1 };
  function tam() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr); dirty = true;
  }
  function dibujar() {
    const im = (arrastre || Math.abs(vel) > 0.02 || auto) ? (chicas[actual] || grandes[actual] || cercana(actual)) : (grandes[actual] || chicas[actual] || cercana(actual));
    if (!im) return;
    const W = cv.width, H = cv.height, s = Math.max(W / im.width, H / im.height);
    const w = im.width * s, h = im.height * s, ox = (W - w) / 2, oy = (H - h) / 2;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(im, ox, oy, w, h);
    const dpr = W / innerWidth; encuadre = { ox: ox / dpr, oy: oy / dpr, w: w / dpr, h: h / dpr };
    pintarLimite(); ponerMarcas(); GIRO.v++;
    $('grados').textContent = Math.round(actual * 360 / G.N) + '°';
  }

  // ---- marcadores: misma cámara que el render (órbita, objetivo, lente de 20 mm) ----
  const pins = PUNTOS.map(p => {
    const d = document.createElement('div'); d.className = 'pin';
    d.innerHTML = '<div class="et"><i></i>' + p.n + '</div><div class="palo"></div>';
    d.querySelector('.et').onclick = () => { $('fTit').textContent = p.n; $('fTxt').textContent = p.d; $('ficha').classList.add('on'); };
    $('marcas').appendChild(d);
    p.X = (p.lng - G.LON) * MXg; p.Y = -(p.lat - G.LAT) * MYg; // Unreal con Cesium: X = este, Y = sur, Z = arriba
    return d;
  });
  function ponerMarcas() {
    const k = camara(actual), t = $('titulo').getBoundingClientRect(), puestas = [];
    // los más cercanos primero; una etiqueta que se monta sobre otra ya puesta se esconde
    PUNTOS.map((p, i) => ({ p, i, q: aCuadro(k, p.X, p.Y, p.z) })).sort((a, b) => (a.q ? a.q[2] : 1e9) - (b.q ? b.q[2] : 1e9)).forEach(({ i, q }) => {
      const el = pins[i];
      if (!q) { el.classList.add('oculto'); return; }
      const sx = encuadre.ox + q[0] * encuadre.w, sy = encuadre.oy + q[1] * encuadre.h;
      const w = el.offsetWidth || 120, h = 34, r = { l: sx - w / 2, r: sx + w / 2, t: sy - h - 26, b: sy - 26 };
      const sobreTitulo = r.l < t.right + 8 && r.t < t.bottom + 8;
      const choca = puestas.some(o => r.l < o.r + 6 && r.r > o.l - 6 && r.t < o.b + 4 && r.b > o.t - 4);
      const dentro = r.l > 8 && r.r < innerWidth - 8 && r.t > 8 && sy < innerHeight - 90 && !sobreTitulo && !choca;
      el.classList.toggle('oculto', !dentro);
      if (dentro) puestas.push(r);
      el.style.left = sx + 'px'; el.style.top = sy + 'px';
    });
  }
  // límite de la localidad (OSM), línea fina pintada sobre la imagen
  let LIMITE = null, verLimite = true;
  fetch('./data3d/kennedy.json').then(r => r.json()).then(d => { LIMITE = d.limite.map(([lng, lat]) => [(lng - G.LON) * MXg, -(lat - G.LAT) * MYg]); dirty = true; }).catch(() => {});
  function pintarLimite() {
    if (!LIMITE || !verLimite) return;
    const k = camara(actual), dpr = cv.width / innerWidth;
    ctx.save(); ctx.lineJoin = 'round';
    ctx.beginPath();
    LIMITE.forEach(([X, Y], j) => { const q = aCuadro(k, X, Y, 0); if (!q) return; const x = (encuadre.ox + q[0] * encuadre.w) * dpr, y = (encuadre.oy + q[1] * encuadre.h) * dpr; j ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.closePath();
    ctx.strokeStyle = 'rgba(6,12,20,.35)'; ctx.lineWidth = 4 * dpr; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,244,214,.9)'; ctx.lineWidth = 1.6 * dpr; ctx.setLineDash([7 * dpr, 5 * dpr]); ctx.stroke();
    ctx.restore();
  }

  // ---- cámara del render para otras capas (data3d/giro_sim.js): proyecta un punto X este, Y sur, Z arriba (m) a la pantalla ----
  const GIRO = window.GIRO = { v: 0, get i() { return actual; }, get N() { return G.N; }, proyectar: null };
  {
    let ci = -1, k = null;
    GIRO.proyectar = (X, Y, Z) => {
      if (ci !== actual) { ci = actual; k = camara(actual); }
      const q = aCuadro(k, X, Y, Z);
      return q && [encuadre.ox + q[0] * encuadre.w, encuadre.oy + q[1] * encuadre.h, q[2]];
    };
  }

  // ---- interacción ----
  const vista = $('vista'), PX_POR_VISTA = () => Math.max(8, innerWidth / 90);
  vista.addEventListener('pointerdown', e => { arrastre = { x: e.clientX, p: pos }; ultimoX = e.clientX; ultimoT = performance.now(); vel = 0; auto = false; $('bAuto').classList.remove('on'); vista.classList.add('arrastrando'); vista.setPointerCapture(e.pointerId); $('ayuda').classList.remove('on'); });
  vista.addEventListener('pointermove', e => {
    if (!arrastre) return;
    const t = performance.now(), dx = e.clientX - ultimoX;
    vel = 0.8 * vel + 0.2 * (-dx / PX_POR_VISTA()) / Math.max(1, t - ultimoT) * 16;
    ultimoX = e.clientX; ultimoT = t;
    pos = arrastre.p - (e.clientX - arrastre.x) / PX_POR_VISTA();
  });
  const soltar = () => { if (!arrastre) return; arrastre = null; vista.classList.remove('arrastrando'); dirty = true; };
  vista.addEventListener('pointerup', soltar); vista.addEventListener('pointercancel', soltar);
  vista.addEventListener('wheel', e => { pos += Math.sign(e.deltaY + e.deltaX) * 1; auto = false; $('bAuto').classList.remove('on'); }, { passive: true });
  $('bIzq').onclick = () => { pos -= 3; }; $('bDer').onclick = () => { pos += 3; };
  $('bAuto').onclick = () => { auto = !auto; $('bAuto').classList.toggle('on', auto); };
  $('bLimite').onclick = () => { verLimite = !verLimite; $('bLimite').classList.toggle('on', verLimite); dirty = true; };
  $('fCerrar').onclick = () => $('ficha').classList.remove('on');
  addEventListener('keydown', e => { if (e.key === 'ArrowLeft') pos -= 1; if (e.key === 'ArrowRight') pos += 1; if (e.key === 'Escape') $('ficha').classList.remove('on'); });
  addEventListener('resize', tam);

  let quieto = 0;
  function bucle() {
    if (!arrastre) { if (auto) pos += 0.12; else { pos += vel; vel *= 0.93; if (Math.abs(vel) < 0.01) vel = 0; } }
    const i = ((Math.round(pos) % G.N) + G.N) % G.N;
    if (i !== actual) { actual = i; dirty = true; quieto = 0; }
    else if (!arrastre && !vel && !auto && ++quieto === 10) { pedirGrande(actual); dirty = true; }
    if (dirty) { dirty = false; dibujar(); }
    requestAnimationFrame(bucle);
  }
  tam(); iniciar(); requestAnimationFrame(bucle);
})();
</script>
